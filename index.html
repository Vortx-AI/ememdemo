  <!--
    The loader. This page runs no code it has not checked.
    SEAL pins one manifest on emem.dev by its sha256. The manifest names every file the page runs by its sha256.
    Each file is read from this site; if its bytes do not match, the true bytes are fetched from emem.dev instead.
    ?boot=emem runs the whole page from emem.dev alone. ?boot=local skips the seal (development only; the page says so).
    It uses only the browser's own SHA-256, so it depends on no library it would first have to trust.
  -->
  <style>
    /* the boot screen: the only thing drawn before the page's code is checked, so it is plain HTML and CSS */
    :root{--bg:#f4f3ee;--fg:#161713;--mute:#6d6e66;--line:#d3d2ca;--ok:#2f6b45;color-scheme:light dark}
    @media(prefers-color-scheme:dark){:root{--bg:#121310;--fg:#ecebe4;--mute:#8d8e85;--line:#2e2f2a;--ok:#6fbf8a}}
    body{margin:0;background:var(--bg);color:var(--fg)}
    #boot{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:14px;padding:16px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mute)}
    #boot img{animation:spin 2.4s linear infinite}
    #boot b{color:var(--fg);font-weight:600;letter-spacing:.02em}
    #boot ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:320px}
    #boot li{width:10px;height:10px;background:var(--line);transition:background .2s}
    #boot li.on{background:var(--ok)}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){#boot img{animation:none}}
  </style>
  <script type="module">
    const SEAL={url:"https://emem.dev/memories/by_attester/ddzmyzhn/skwqbvwiyv7r6q5yidajm5gph4.md",sha256:"59fb9fcf4621bc24bb75a991e76c83fa6465d7e0c47b45d50fbfebfd414c68f8",site:"ddzmyzhn7wy55qemazk3vqawzulzrzrt457xr7qgjvqr7mvanolq"};
    const mode=new URLSearchParams(location.search).get("boot");
    const hex=async b=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",b))].map(x=>x.toString(16).padStart(2,"0")).join("");
    const get=async u=>{const x=await fetch(u,{cache:"no-cache"});if(!x.ok)throw new Error(`${u} answered ${x.status}`);return x.arrayBuffer()};
    const blob=(b,type)=>URL.createObjectURL(new Blob([b],{type}));
    const refuse=why=>{document.body.replaceChildren(Object.assign(document.createElement("pre"),{style:"margin:32px;font:14px/1.6 ui-monospace,monospace;color:#a3372b;white-space:pre-wrap",textContent:"This page refused to run.\n\n"+why+"\n\nNothing it could not check was executed."}))};
    const bootSay=t=>{const e=document.getElementById("boot-say");if(e)e.textContent=t};
    const bootMap=(n,done)=>{const o=document.getElementById("boot-map");if(!o)return;if(o.children.length!==n)o.replaceChildren(...Array.from({length:n},()=>document.createElement("li")));[...o.children].forEach((c,i)=>c.className=i<done?"on":"")};
    const unsealed=()=>{const l=document.createElement("link");l.rel="stylesheet";l.href="./src/emem.css";document.head.append(l);globalThis.__seal={unsealed:true};return import("./src/eio.mjs")};
    try{
      if(mode==="local"||!SEAL.url)await unsealed();
      else{
        const mb=await get(SEAL.url);
        if(await hex(mb)!==SEAL.sha256)throw new Error("The manifest at "+SEAL.url+" does not match the sha256 this page pins.");
        const text=new TextDecoder().decode(mb),seal=globalThis.__seal={url:SEAL.url,files:{},report:[],sealed_by:(text.match(/^sealed_by (\S+)/m)||[])[1]};
        // only the site's own key may seal it: the manifest must name that key and live in its namespace
        if(SEAL.site&&(seal.sealed_by!==SEAL.site||!SEAL.url.startsWith("https://emem.dev/memories/by_attester/"+SEAL.site.slice(0,8)+"/")))throw new Error("The manifest was sealed by "+(seal.sealed_by||"no key")+", not by this site's key "+SEAL.site+".");
        const files=text.split("\n").filter(l=>l.startsWith("file ")).map(l=>{const[,path,sha,url]=l.split(/\s+/);return{path,sha,url}});
        let checked=0;bootMap(files.length,0);bootSay(`checking ${files.length} files against the seal`);
        const libs=Object.fromEntries(text.split("\n").filter(l=>l.startsWith("lib ")).map(l=>{const[,url,sha]=l.split(/\s+/);return[url,sha]}));
        await Promise.all(files.map(async f=>{
          let b=mode==="emem"?null:await get("./"+f.path).catch(()=>null),from="site";
          if(!b||await hex(b)!==f.sha){b=await get(f.url);from=mode==="emem"?"emem":"emem, because this site's copy did not match";if(await hex(b)!==f.sha)throw new Error(f.path+" does not match its seal, even as fetched from emem.dev.")}
          seal.files[f.path]={text:new TextDecoder().decode(b),from};seal.report.push({path:f.path,from});
          bootMap(files.length,++checked);bootSay(`${checked} of ${files.length} files match the seal`);
        }));
        // modules run from their checked bytes; a relative import is pointed at the checked copy of the file it names
        const urls={};
        for(const f of files.filter(f=>/\.m?js$/.test(f.path))){
          const dir=f.path.replace(/[^/]*$/,"");
          const t=seal.files[f.path].text.replace(/(["'])\.\/([^"']+)\1/g,(m,q,rel)=>urls[dir+rel]?q+urls[dir+rel]+q:m);
          urls[f.path]=blob(t,"text/javascript");
        }
        for(const f of files.filter(f=>f.path.endsWith(".css"))){const l=document.createElement("link");l.rel="stylesheet";l.href=blob(seal.files[f.path].text,"text/css");document.head.append(l)}
        // third-party readers load later, and only if their bytes match the seal
        const libCache={};
        seal.lib=u=>libs[u]?libCache[u]??=get(u).then(async b=>{if(await hex(b)!==libs[u])throw new Error(u+" does not match its seal; it was not run.");return blob(b,"text/javascript")}):u;
        await import(urls["src/eio.mjs"]);
      }
    }catch(e){refuse(e.message||String(e))}
  </script>
